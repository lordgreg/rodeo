# Dependency updates, self-hosted.
#
# Renovate runs from this workflow rather than the hosted GitHub App: once a
# day, or on demand from the Actions tab. It reads renovate.json and opens pull
# requests against this repository.
#
# One-time setup:
#   1. Create a classic personal access token with the `repo` scope
#      (Settings → Developer settings → Personal access tokens).
#   2. Store it as the `RENOVATE_TOKEN` secret
#      (Settings → Secrets and variables → Actions).
#
# It has to be a PAT, not the built-in GITHUB_TOKEN: pull requests opened with
# GITHUB_TOKEN do not trigger other workflows, so dependency PRs would never
# run CI.
#
# Without that token the run stops immediately with a message saying so,
# rather than failing somewhere in the middle with a confusing API error.
name: Renovate

on:
  schedule:
    # 04:00 UTC daily — outside the hours anyone is looking at the repository.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - info
          - debug
      dry_run:
        description: "Report what would happen without opening pull requests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the token is present
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "${RENOVATE_TOKEN:-}" ]; then
            echo "RENOVATE_TOKEN is not set — see the header of this workflow." >&2
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # This repository only: never go looking for others the token can see.
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || '' }}
