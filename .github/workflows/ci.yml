name: CI

on:
  push:
    branches: [master]
  # Deliberately unfiltered: `test` and `deny` are required status checks on
  # master, and a workflow-level `paths-ignore` would leave a prose-only pull
  # request waiting forever for a check that never starts. Skipping docs-only
  # changes has to happen inside a job, not here.
  pull_request:

permissions:
  contents: read

# A new push to a branch or pull request makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets

      # On master the suite is run by the coverage job through `cargo llvm-cov`,
      # so repeating it here would compile the crate and the tests twice. That
      # instrumented run does not include doc tests, which is fine while there
      # are none: the only fenced block in the source is TOML, in
      # src/ui/keymap.rs. Adding a Rust doc test would make it run on pull
      # requests only.
      - name: Test
        if: github.event_name != 'push'
        run: cargo test --locked --all

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  # Licence and security audit of the dependency tree.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Coverage is informational: most of the code is TUI rendering, which is only
  # partly reachable from tests (see tests/render.rs). Master only: the
  # instrumented build is the most expensive job in this workflow and nothing
  # gates on the result, so a pull request should not pay for it. This is also
  # the run that executes the test suite on master, which is why the `test` job
  # above skips that step on a push.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect coverage
        run: |
          cargo llvm-cov --locked --all-features --workspace --lcov \
            --output-path lcov.info

      - name: Summarise
        run: cargo llvm-cov report --summary-only

      # Uploaded as an artifact rather than pushed to a coverage service: that
      # would need an account and a token for a project that has neither.
      - name: Upload lcov
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
