[package]
name = "rodeo"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
env_logger = "0.11.10"
flate2 = "1.1.9"
ignore = "0.4.31"
image = "0.25.10"
infer = "0.16"
log = "0.4.31"
notify = "8.2.0"
nucleo = "0.5.0"
pdf-extract = "0.12.0"
ratatui = "0.30.0"
ratatui-image = { version = "11.0.4", default-features = false, features = ["image-defaults", "crossterm"] }
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
syntect = "5.3.0"
tar = "0.4.46"
trash = "5.2.6"
xdg = "3.0.0"
yaml_serde = "0.10.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
