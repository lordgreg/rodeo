[package]
name = "rodeo"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "A dual-pane terminal file manager with Vim-style keybindings"
repository = "https://codeberg.org/grepx/rodeo"
readme = "README.md"
keywords = ["file-manager", "tui", "terminal", "ratatui", "vim"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
clap_mangen = "0.3.0"
color-eyre = "0.6.5"
crossterm = "0.29.0"
env_logger = "0.11.11"
flate2 = "1.1.9"
ignore = "0.4.31"
image = "0.25.10"
infer = "0.22.0"
libc = "0.2.189"
log = "0.4.33"
notify = "8.2.0"
nucleo = "0.5.0"
pdf-extract = "0.12.0"
# unstable-rendered-line-info exposes Paragraph::line_count, which is the only
# correct way to bound scrolling of wrapped text (a hand-rolled estimate
# under-counts word wrapping and makes the last lines unreachable).
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["image-defaults", "crossterm"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# Only the pieces rodeo actually uses: bundled syntax definitions loaded from
# the binary dump, plus the fancy-regex engine (pure Rust, no onig C library).
# Dropping yaml-load also drops yaml-rust, which is unmaintained
# (RUSTSEC-2024-0320); plist-load went with the hand-built theme (6.2.1).
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
tar = "0.4.46"
toml = "1.1.4"
trash = "5.2.6"
xdg = "3.0.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
clap_mangen = "0.3.0"
tempfile = "3.27.0"
