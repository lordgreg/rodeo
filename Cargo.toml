[package]
name = "rodeo"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
env_logger = "0.11.10"
image = "0.25.10"
log = "0.4.31"
ratatui = "0.30.0"
ratatui-image = { version = "11.0.4", default-features = false, features = ["image-defaults", "crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
syntect = "5.3.0"
xdg = "3.0.0"
yaml_serde = "0.10.4"
