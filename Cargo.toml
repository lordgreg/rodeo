[package]
name = "rodeo"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
description = "A dual-pane terminal file manager with Vim-style keybindings"
repository = "https://github.com/lordgreg/rodeo"
readme = "README.md"
keywords = ["file-manager", "tui", "terminal", "ratatui", "vim"]
categories = ["command-line-utilities", "filesystem"]
# The README's images are for the repository page. crates.io resolves relative
# links against `repository`, so it renders them without the .crate carrying
# several megabytes of PNG in every published version.
exclude = ["screenshots"]

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
clap_mangen = "0.3.4"
color-eyre = "0.6.5"
crossterm = "0.29.0"
env_logger = "0.11.11"
flate2 = "1.1.11"
ignore = "0.4.34"
image = "0.25.10"
infer = "0.22.0"
# Only the `std` feature: `format_date` formats a UTC timestamp and nothing
# else, so the tzdb bundles the default features pull in are dead weight.
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
libc = "0.2.191"
log = "0.4.35"
notify = "8.2.2"
nucleo = "0.5.0"
pdf-extract = "0.12.1"
# unstable-rendered-line-info exposes Paragraph::line_count, which is the only
# correct way to bound scrolling of wrapped text (a hand-rolled estimate
# under-counts word wrapping and makes the last lines unreachable).
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Only the pieces rodeo actually uses: bundled syntax definitions loaded from
# the binary dump, plus the fancy-regex engine (pure Rust, no onig C library).
# Dropping yaml-load also drops yaml-rust, which is unmaintained
# (RUSTSEC-2024-0320); plist-load went with the hand-built theme (6.2.1).
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
trash = "5.4.0"
xdg = "3.0.0"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
clap_mangen = "0.3.4"
